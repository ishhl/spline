<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прикладная математика</title>
    <!-- MathJax (формулы) -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <!-- Chart.js (графики) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; background-color: #f4f6f9; color: #333; line-height: 1.6; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 0; }
        h3 { color: #008800; margin-top: 30px; border-left: 4px solid #008800; padding-left: 10px; }
        b { color: #2c3e50; }
        .inputs { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .buttons-row { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        label { font-weight: bold; }
        input { padding: 12px; border: 1px solid #ccd; border-radius: 5px; font-size: 16px; }
        button { flex: 1; padding: 15px; background: #008800; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button.alt-btn { background: #2c3e50; }
        button:hover { filter: brightness(1.2); }
        #chart-container { display: none; margin-top: 30px; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ccc; }
        #report { display: none; background: #fffaf0; padding: 20px; border-radius: 8px; border: 1px solid #e2d9c3; overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; margin: 15px 0; background: white; }
        th, td { border: 1px solid #bbb; text-align: center; padding: 10px; }
        th { background: #e9ecef; }
        .math-block { margin: 15px 0; overflow-x: auto; }
    </style>
</head>
<body>

<div class="container">
    <h2>Калькулятор: Сплайны и МНК</h2>
    <p style="text-align: center; margin-top: 5px; color: #7f8c8d; font-style: italic; font-size: 14px;">от Ишутина</p>
    
    <div class="inputs">
        <label>Введите значения X через пробел:</label>
        <input type="text" id="x_vals" value="2 3 4 6">
        
        <label>Введите значения Y через пробел:</label>
        <input type="text" id="y_vals" value="3 -1 2 1">
        
        <div class="buttons-row">
            <button onclick="calculateSpline()">Кубический сплайн</button>
            <button class="alt-btn" onclick="calculateMNK()">Линейный МНК</button>
        </div>
    </div>
    
    <!-- Отчет -->
    <div id="report"></div>

    <!-- Контейнер для Графика -->
    <div id="chart-container">
        <canvas id="splineChart"></canvas>
    </div>
</div>

<script>
// Вспомогательные функции
function fmt(num) { return (Math.round(num * 1000) / 1000).toString().replace('.', ','); }
function wrapNeg(num) { return num < 0 ? `(${fmt(num)})` : fmt(num); }

let chartInstance = null;

// ===============================================
// ЛОГИКА 1: КУБИЧЕСКИЙ СПЛАЙН (С ПОЛНОЙ ПРОВЕРКОЙ)
// ===============================================
function calculateSpline() {
    let xStr = document.getElementById('x_vals').value.trim().split(/\s+/);
    let yStr = document.getElementById('y_vals').value.trim().split(/\s+/);
    let x = xStr.map(Number);
    let y = yStr.map(Number);
    let n = x.length - 1;

    if (x.length !== y.length || n < 1) { alert("Ошибка: количество X и Y должно совпадать и быть больше 1!"); return; }

    let h = [], alpha = [], beta = [], a = [], b = [], c = [], d = [], C_arr = [];
    for (let i = 1; i <= n; i++) h[i] = x[i] - x[i-1];

    alpha[0] = 0; beta[0] = 0;
    for (let i = 1; i < n; i++) {
        let A = h[i];
        let C = 2 * (h[i] + h[i+1]);
        let B = h[i+1];
        let F = 3 * ((y[i+1] - y[i]) / h[i+1] - (y[i] - y[i-1]) / h[i]);
        alpha[i] = -B / (A * alpha[i-1] + C);
        beta[i] = (F - A * beta[i-1]) / (A * alpha[i-1] + C);
    }

    C_arr[n] = 0;
    for (let i = n - 1; i >= 1; i--) C_arr[i] = alpha[i] * C_arr[i+1] + beta[i];
    C_arr[0] = 0;

    for (let i = 1; i <= n; i++) {
        a[i] = y[i-1];
        d[i] = (C_arr[i] - C_arr[i-1]) / (3 * h[i]);
        b[i] = (y[i] - y[i-1]) / h[i] - (h[i] / 3) * (2 * C_arr[i-1] + C_arr[i]);
    }

    let html = `<h3>Нахождение кубического сплайна:</h3>`;
    
    html += `<b>Дано:</b>`;
    let table = `<table><tr><td><b>X</b></td>`;
    for(let val of x) table += `<td>${fmt(val)}</td>`;
    table += `</tr><tr><td><b>Y</b></td>`;
    for(let val of y) table += `<td>${fmt(val)}</td>`;
    table += `</tr></table>`;
    html += table;

    html += `<b>Формула кубического сплайна имеет вид:</b><br>`;
    html += `<div class="math-block">$$ S_i = a_i + b_i \\cdot (x - x_{i-1}) + c_i \\cdot (x - x_{i-1})^2 + d_i \\cdot (x - x_{i-1})^3 $$</div>`;
    
    html += `<b>1. Находим расстояния между точками по оси X:</b><br>`;
    html += `<div class="math-block">$$ h_i = x_i - x_{i-1} $$</div>Получаем:<br><div class="math-block">$$ \\begin{aligned} `;
    for(let i=1; i<=n; i++) html += `h_${i} &= ${fmt(x[i])} - ${wrapNeg(x[i-1])} = ${fmt(h[i])} \\\\ `;
    html += `\\end{aligned} $$</div>`;

    html += `<b>2. Общие формулы</b><br><b>2.1 Коэффициенты С.</b><br>Чтобы найти все a, b, c, d, нам сначала нужно найти вспомогательные коэффициенты C.<br>`;
    html += `По правилам "естественного" сплайна, на краях графика они равны нулю: <b>C₀ = 0, Cₙ = 0</b>.<br><br>`;
    html += `Для внутренних C используется формула:<br>`;
    html += `<div class="math-block">$$ h_i \\cdot C_{i-1} + 2 \\cdot (h_i + h_{i+1}) \\cdot C_i + h_{i+1} \\cdot C_{i+1} = 3 \\cdot \\left( \\frac{y_{i+1} - y_i}{h_{i+1}} - \\frac{y_i - y_{i-1}}{h_i} \\right) $$</div>`;

    if(n > 1) {
        html += `Получаем систему:<br><div class="math-block">$$ \\begin{cases} `;
        for(let i=1; i<n; i++) {
            let left = `${fmt(h[i])} \\cdot C_{${i-1}} + 2 \\cdot (${fmt(h[i])} + ${fmt(h[i+1])}) \\cdot C_{${i}} + ${fmt(h[i+1])} \\cdot C_{${i+1}}`;
            let right = `3 \\cdot \\left( \\frac{${fmt(y[i+1])} - ${wrapNeg(y[i])}}{${fmt(h[i+1])}} - \\frac{${fmt(y[i])} - ${wrapNeg(y[i-1])}}{${fmt(h[i])}} \\right)`;
            html += `${left} = ${right} \\\\ `;
        }
        html += `\\end{cases} $$</div>`;
        
        let cRes = [];
        for(let i=1; i<n; i++) cRes.push(`C_${i} = ${fmt(C_arr[i])}`);
        html += `Получаем: <b>${cRes.join('; ')}</b>.<br><br>`;
    }

    html += `Следовательно (\\( c_i = C_{i-1} \\)):<br><div class="math-block">$$ \\begin{aligned} `;
    for(let i=1; i<=n; i++) html += `c_${i} &= ${fmt(C_arr[i-1])} \\\\ `;
    html += `\\end{aligned} $$</div>`;

    html += `<b>2.2 Коэффициенты a.</b><div class="math-block">$$ a_i = y_{i-1} $$</div>Таким образом:<br><div class="math-block">$$ \\begin{aligned} `;
    for(let i=1; i<=n; i++) html += `a_${i} &= ${fmt(y[i-1])} \\\\ `;
    html += `\\end{aligned} $$</div>`;

    html += `<b>2.3 Коэффициенты b.</b><div class="math-block">$$ b_i = \\frac{y_i - y_{i-1}}{h_i} - \\frac{h_i}{3} \\cdot (2 \\cdot C_{i-1} + C_i) $$</div>Таким образом:<br><div class="math-block">$$ \\begin{aligned} `;
    for(let i=1; i<=n; i++) {
        html += `b_${i} &= \\frac{${fmt(y[i])} - ${wrapNeg(y[i-1])}}{${fmt(h[i])}} - \\frac{${fmt(h[i])}}{3} \\cdot (2 \\cdot ${wrapNeg(C_arr[i-1])} + ${wrapNeg(C_arr[i])}) = ${fmt(b[i])} \\\\ `;
    }
    html += `\\end{aligned} $$</div>`;

    html += `<b>2.4 Коэффициенты d.</b><div class="math-block">$$ d_i = \\frac{C_i - C_{i-1}}{3 \\cdot h_i} $$</div>Таким образом:<br><div class="math-block">$$ \\begin{aligned} `;
    for(let i=1; i<=n; i++) {
        html += `d_${i} &= \\frac{${fmt(C_arr[i])} - ${wrapNeg(C_arr[i-1])}}{3 \\cdot ${fmt(h[i])}} = ${fmt(d[i])} \\\\ `;
    }
    html += `\\end{aligned} $$</div>`;

    html += `<h3>Итоговый сплайн:</h3><div class="math-block">$$ \\begin{aligned} `;
    for(let i=1; i<=n; i++) {
        let a_str = `${fmt(a[i])}`;
        let b_str = b[i] >= 0 ? `+ ${fmt(b[i])}` : `- ${fmt(Math.abs(b[i]))}`;
        let c_str = C_arr[i-1] >= 0 ? `+ ${fmt(C_arr[i-1])}` : `- ${fmt(Math.abs(C_arr[i-1]))}`;
        let d_str = d[i] >= 0 ? `+ ${fmt(d[i])}` : `- ${fmt(Math.abs(d[i]))}`;
        let xTerm = `(x - ${wrapNeg(x[i-1])})`;
        html += `S_${i} &= ${a_str} ${b_str} \\cdot ${xTerm} ${c_str} \\cdot ${xTerm}^2 ${d_str} \\cdot ${xTerm}^3 \\\\ `;
    }
    html += `\\end{aligned} $$</div>`;

    // ПРОВЕРКИ
    html += `<h3 style="margin-top: 40px; color: #2c3e50; border-bottom: 2px solid #ccc;">Проверка совпадений требований:</h3>`;
    
    html += `<b>1) Требуем совпадения в узлах значений функции и значений сплайна:</b>`;
    html += `<div class="math-block">$$ \\begin{aligned} S_i(x_{i-1}) &= y_{i-1} \\\\ S_i(x_i) &= y_i \\\\ i &= 1, n \\end{aligned} $$</div>`;
    
    for(let i=1; i<=n; i++) {
        let h_calc = h[i];
        let val1 = a[i]; 
        let val2 = a[i] + b[i]*h_calc + C_arr[i-1]*h_calc*h_calc + d[i]*h_calc*h_calc*h_calc;
        
        let a_str = `${fmt(a[i])}`;
        let b_str = b[i] >= 0 ? `+ ${fmt(b[i])}` : `- ${fmt(Math.abs(b[i]))}`;
        let c_str = C_arr[i-1] >= 0 ? `+ ${fmt(C_arr[i-1])}` : `- ${fmt(Math.abs(C_arr[i-1]))}`;
        let d_str = d[i] >= 0 ? `+ ${fmt(d[i])}` : `- ${fmt(Math.abs(d[i]))}`;
        
        html += `<div class="math-block">$$ S_${i}(${fmt(x[i-1])}) = ${a_str} ${b_str} \\cdot (${fmt(x[i-1])} - ${wrapNeg(x[i-1])}) ${c_str} \\cdot (${fmt(x[i-1])} - ${wrapNeg(x[i-1])})^2 ${d_str} \\cdot (${fmt(x[i-1])} - ${wrapNeg(x[i-1])})^3 = ${fmt(val1)} $$</div>`;
        html += `<div class="math-block">$$ S_${i}(${fmt(x[i])}) = ${a_str} ${b_str} \\cdot (${fmt(x[i])} - ${wrapNeg(x[i-1])}) ${c_str} \\cdot (${fmt(x[i])} - ${wrapNeg(x[i-1])})^2 ${d_str} \\cdot (${fmt(x[i])} - ${wrapNeg(x[i-1])})^3 = ${fmt(val2)} $$</div>`;
    }

    let checkTable = `<table><tr><td><b>X</b></td>`;
    for(let i=0; i<=n; i++) checkTable += `<td>${fmt(x[i])}</td>`;
    checkTable += `</tr><tr><td><b>Y</b></td>`;
    for(let i=0; i<=n; i++) checkTable += `<td>${fmt(y[i])}</td>`;
    checkTable += `</tr>`;
    for(let i=1; i<=n; i++) {
        checkTable += `<tr><td><b>S_${i}</b></td>`;
        for(let j=0; j<=n; j++) {
            if (j === i-1) {
                checkTable += `<td>${fmt(a[i])}</td>`;
            } else if (j === i) {
                let diff = h[i];
                let val2 = a[i] + b[i]*diff + C_arr[i-1]*diff*diff + d[i]*diff*diff*diff;
                checkTable += `<td>${fmt(val2)}</td>`;
            } else {
                checkTable += `<td></td>`;
            }
        }
        checkTable += `</tr>`;
    }
    checkTable += `</table>`;
    html += checkTable;

    html += `<b>2) Требуем непрерывности функции первой и второй производной во всех внутренних точках, включая узловые:</b>`;
    html += `<div class="math-block">$$ \\begin{aligned} S'_i(x_i -) &= S'_{i+1}(x_i +) \\\\ S''_i(x_i -) &= S''_{i+1}(x_i +) \\\\ i &= 1, n-1 \\end{aligned} $$</div>`;
    
    html += `<div class="math-block">$$ \\begin{aligned} S'_i(x) &= b_i + 2 \\cdot c_i \\cdot (x - x_{i-1}) + 3 \\cdot d_i \\cdot (x - x_{i-1})^2 \\\\ S''_i(x) &= 2 \\cdot c_i + 6 \\cdot d_i \\cdot (x - x_{i-1}) \\\\ S'_{i+1}(x) &= b_{i+1} + 2 \\cdot c_{i+1} \\cdot (x - x_i) + 3 \\cdot d_{i+1} \\cdot (x - x_i)^2 \\\\ S''_{i+1}(x) &= 2 \\cdot c_{i+1} + 6 \\cdot d_{i+1} \\cdot (x - x_i) \\end{aligned} $$</div>`;
    
    html += `<div class="math-block">$$ \\begin{aligned} S'_i(x_i -) &= b_i + 2 \\cdot c_i \\cdot h_i + 3 \\cdot d_i \\cdot h_i^2 \\\\ S''_i(x_i -) &= 2 \\cdot c_i + 6 \\cdot d_i \\cdot h_i \\\\ S'_{i+1}(x_i +) &= b_{i+1} \\\\ S''_{i+1}(x_i +) &= 2 \\cdot c_{i+1} \\end{aligned} $$</div>`;

    if(n > 1) {
        for(let i=1; i<n; i++) {
            let left_d1 = b[i] + 2*C_arr[i-1]*h[i] + 3*d[i]*h[i]*h[i];
            let left_d2 = 2*C_arr[i-1] + 6*d[i]*h[i];
            let right_d1 = b[i+1];
            let right_d2 = 2*C_arr[i];

            html += `<b>Для узла \\(\\; x_${i} = ${fmt(x[i])} \\):</b><br>`;
            html += `\\( S'_{${i}}(${wrapNeg(x[i])} -) = ${fmt(b[i])} + 2 \\cdot ${wrapNeg(C_arr[i-1])} \\cdot ${fmt(h[i])} + 3 \\cdot ${wrapNeg(d[i])} \\cdot ${fmt(h[i])}^2 = \\mathbf{${fmt(left_d1)}} \\)<br>`;
            html += `\\( S'_{${i+1}}(${wrapNeg(x[i])} +) = \\mathbf{${fmt(right_d1)}} \\)<br>`;
            html += `\\( S''_{${i}}(${wrapNeg(x[i])} -) = 2 \\cdot ${wrapNeg(C_arr[i-1])} + 6 \\cdot ${wrapNeg(d[i])} \\cdot ${fmt(h[i])} = \\mathbf{${fmt(left_d2)}} \\)<br>`;
            html += `\\( S''_{${i+1}}(${wrapNeg(x[i])} +) = 2 \\cdot ${wrapNeg(C_arr[i])} = \\mathbf{${fmt(right_d2)}} \\)<br><br>`;
        }
    }

    html += `<b>3) Требуем равенства второй производной нулю в местах нулевой кривизны:</b>`;
    html += `<div class="math-block">$$ \\begin{aligned} S''(x_0 +) &= 0 \\\\ S''(x_n -) &= 0 \\end{aligned} $$</div>`;

    let left_edge_d2 = 2 * C_arr[0];
    let right_edge_d2 = 2 * C_arr[n-1] + 6 * d[n] * h[n];
    
    html += `На левом краю (\\( x_0 = ${fmt(x[0])} \\)):<br>`;
    html += `\\( S''_{1}(x_0 +) = 2 \\cdot c_1 = 2 \\cdot ${wrapNeg(C_arr[0])} = \\mathbf{${fmt(Math.abs(left_edge_d2) < 0.0001 ? 0 : left_edge_d2)}} \\)<br><br>`;
    
    html += `На правом краю (\\( x_n = ${fmt(x[n])} \\)):<br>`;
    html += `\\( S''_{${n}}(x_n -) = 2 \\cdot c_{${n}} + 6 \\cdot d_{${n}} \\cdot h_{${n}} = 2 \\cdot ${wrapNeg(C_arr[n-1])} + 6 \\cdot ${wrapNeg(d[n])} \\cdot ${fmt(h[n])} = \\mathbf{${fmt(Math.abs(right_edge_d2) < 0.0001 ? 0 : right_edge_d2)}} \\)<br>`;

    document.getElementById('report').innerHTML = html;
    document.getElementById('report').style.display = 'block';
    
    let splinePoints = [];
    for (let i = 1; i <= n; i++) {
        let stepSize = h[i] / 50;
        for (let j = 0; j <= 50; j++) {
            let cx = x[i-1] + j * stepSize, diff = cx - x[i-1];
            let cy = a[i] + b[i]*diff + C_arr[i-1]*diff*diff + d[i]*diff*diff*diff;
            splinePoints.push({x: cx, y: cy});
        }
    }
    drawChart('Сплайн (S(x))', splinePoints, x, y, true);
    MathJax.typesetPromise();
}

// ===============================================
// ЛОГИКА 2: ЛИНЕЙНЫЙ МНК
// ===============================================
function calculateMNK() {
    let xStr = document.getElementById('x_vals').value.trim().split(/\s+/);
    let yStr = document.getElementById('y_vals').value.trim().split(/\s+/);
    let x = xStr.map(Number);
    let y = yStr.map(Number);
    let n = x.length;

    if (x.length !== y.length || n < 2) { alert("Ошибка: количество X и Y должно совпадать и быть больше 1!"); return; }

    let sumX = 0, sumY = 0, sumX2 = 0, sumXY = 0;
    for(let i=0; i<n; i++) {
        sumX += x[i];
        sumY += y[i];
        sumX2 += x[i]*x[i];
        sumXY += x[i]*y[i];
    }

    let D = n * sumX2 - sumX * sumX;
    let a = (n * sumXY - sumX * sumY) / D;
    let b = (sumY * sumX2 - sumX * sumXY) / D;

    let html = `<h3>Линейная аппроксимация (МНК):</h3>`;
    html += `Ищем уравнение прямой вида: <div class="math-block">$$ y = a \\cdot x + b $$</div>`;
    
    html += `<b>1. Составляем расчетную таблицу:</b>`;
    let table = `<table><tr><th>i</th><th>x</th><th>y</th><th>x²</th><th>x·y</th></tr>`;
    for(let i=0; i<n; i++) {
        table += `<tr><td>${i+1}</td><td>${fmt(x[i])}</td><td>${fmt(y[i])}</td><td>${fmt(x[i]*x[i])}</td><td>${fmt(x[i]*y[i])}</td></tr>`;
    }
    table += `<tr style="background:#e9ecef; font-weight:bold;"><td>Σ</td><td>${fmt(sumX)}</td><td>${fmt(sumY)}</td><td>${fmt(sumX2)}</td><td>${fmt(sumXY)}</td></tr></table>`;
    html += table;

    html += `<b>2. Система нормальных уравнений:</b><br>`;
    html += `<div class="math-block">$$ \\begin{cases} a \\sum x^2 + b \\sum x = \\sum xy \\\\ a \\sum x + b \\cdot n = \\sum y \\end{cases} $$</div>`;
    
    html += `Подставляем суммы из таблицы:<br>`;
    html += `<div class="math-block">$$ \\begin{cases} ${fmt(sumX2)}a + ${fmt(sumX)}b = ${fmt(sumXY)} \\\\ ${fmt(sumX)}a + ${n}b = ${fmt(sumY)} \\end{cases} $$</div>`;
    
    html += `Решая систему линейных уравнений, получаем:<br>`;
    html += `<div class="math-block">$$ a = ${fmt(a)}; \\quad b = ${fmt(b)} $$</div>`;
    
    html += `<h3 style="color: #2c3e50;">Итоговое уравнение прямой:</h3>`;
    html += `<div class="math-block" style="font-size: 1.2em; border: 2px solid #008800; padding: 10px; text-align:center;">$$ y = ${fmt(a)} \\cdot x ${b>=0 ? '+' : '-'} ${fmt(Math.abs(b))} $$</div>`;

    html += `<h3 style="margin-top: 30px; color: #2c3e50; border-bottom: 2px solid #ccc;">Проверка МНК (Оценка точности):</h3>`;
    html += `Посчитаем отклонения (\\(\\Delta\\)) реальных значений \\(Y\\) от вычисленных по формуле \\(Y_{расч}\\).<br>`;
    
    let checkTbl = `<table><tr><th>x</th><th>Y (факт)</th><th>Y расч.</th><th>Отклонение Δ</th><th>Δ²</th></tr>`;
    let sumErr2 = 0;
    for(let i=0; i<n; i++) {
        let y_calc = a * x[i] + b;
        let delta = y[i] - y_calc;
        let delta2 = delta * delta;
        sumErr2 += delta2;
        checkTbl += `<tr><td>${fmt(x[i])}</td><td>${fmt(y[i])}</td><td>${fmt(y_calc)}</td><td>${fmt(delta)}</td><td>${fmt(delta2)}</td></tr>`;
    }
    checkTbl += `<tr style="background:#e9ecef; font-weight:bold;"><td colspan="4" style="text-align:right">Сумма квадратов отклонений (\\(S_{наим}\\)):</td><td>${fmt(sumErr2)}</td></tr></table>`;
    html += checkTbl;

    document.getElementById('report').innerHTML = html;
    document.getElementById('report').style.display = 'block';
    
    let minX = Math.min(...x), maxX = Math.max(...x);
    let offset = (maxX - minX) * 0.1;
    let mnkPoints = [
        {x: minX - offset, y: a*(minX - offset) + b},
        {x: maxX + offset, y: a*(maxX + offset) + b}
    ];

    drawChart('МНК-прямая (Тренд)', mnkPoints, x, y, false);
    MathJax.typesetPromise();
}

function drawChart(lineLabel, lineData, x_arr, y_arr, isCurve) {
    let scatterPoints = [];
    for(let i=0; i<x_arr.length; i++) scatterPoints.push({x: x_arr[i], y: y_arr[i]});

    document.getElementById('chart-container').style.display = 'block';
    if (chartInstance) chartInstance.destroy(); 
    
    let ctx = document.getElementById('splineChart').getContext('2d');
    chartInstance = new Chart(ctx, {
        type: 'scatter',
        data: {
            datasets: [{
                label: lineLabel,
                data: lineData,
                borderColor: '#0066ff',
                backgroundColor: 'transparent',
                borderWidth: 2,
                showLine: true,
                pointRadius: 0,
                tension: isCurve ? 0.4 : 0
            }, {
                label: 'Исходные точки',
                data: scatterPoints,
                backgroundColor: '#ff0000',
                borderColor: '#ff0000',
                pointRadius: 6,
                showLine: false
            }]
        },
        options: {
            responsive: true,
            scales: { x: { title: { display: true, text: 'Ось X', font: {weight: 'bold'} } }, y: { title: { display: true, text: 'Ось Y', font: {weight: 'bold'} } } },
            plugins: { legend: { position: 'top' } }
        }
    });
}
