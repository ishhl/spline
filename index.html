<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расчет кубического сплайна</title>
    <!-- Подключаем библиотеку для рисования красивых формул -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; background-color: #f4f6f9; color: #333; line-height: 1.6; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        h3 { color: #008800; margin-top: 30px; border-left: 4px solid #008800; padding-left: 10px; }
        b { color: #2c3e50; }
        .inputs { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
        label { font-weight: bold; }
        input { padding: 12px; border: 1px solid #ccd; border-radius: 5px; font-size: 16px; }
        button { padding: 15px; background: #008800; color: white; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #006600; }
        #report { display: none; background: #fffaf0; padding: 20px; border-radius: 8px; border: 1px solid #e2d9c3; margin-top: 20px; overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; margin: 15px 0; background: white; }
        th, td { border: 1px solid #bbb; text-align: center; padding: 10px; }
        th { background: #e9ecef; }
        .math-block { margin: 15px 0; overflow-x: auto; }
    </style>
</head>
<body>

<div class="container">
    <h2>Подробное решение кубического сплайна</h2>
    
    <div class="inputs">
        <label>Введите значения X через пробел:</label>
        <input type="text" id="x_vals" value="2 3 4 6">
        
        <label>Введите значения Y через пробел:</label>
        <input type="text" id="y_vals" value="3 -1 2 1">
        
        <button onclick="calculateAndRender()">Сгенерировать решение</button>
    </div>
    
    <!-- Сюда будет выводиться наше красивое решение -->
    <div id="report"></div>
</div>

<script>
// Вспомогательные функции для форматирования чисел (до 2 знаков после запятой, как у тебя)
function fmt(num) { return (Math.round(num * 100) / 100).toString().replace('.', ','); }
function wrapNeg(num) { return num < 0 ? `(${fmt(num)})` : fmt(num); }

function calculateAndRender() {
    let xStr = document.getElementById('x_vals').value.trim().split(/\s+/);
    let yStr = document.getElementById('y_vals').value.trim().split(/\s+/);
    let x = xStr.map(Number);
    let y = yStr.map(Number);
    let n = x.length - 1;

    if (x.length !== y.length || n < 1) {
        alert("Ошибка: количество X и Y должно совпадать!");
        return;
    }

    // Математические расчеты (как в Паскале)
    let h = [], alpha = [], beta = [], a = [], b = [], c = [], d = [], C_arr = [];
    for (let i = 1; i <= n; i++) h[i] = x[i] - x[i-1];

    alpha[0] = 0; beta[0] = 0;
    for (let i = 1; i < n; i++) {
        let A = h[i];
        let C = 2 * (h[i] + h[i+1]);
        let B = h[i+1];
        let F = 3 * ((y[i+1] - y[i]) / h[i+1] - (y[i] - y[i-1]) / h[i]);
        alpha[i] = -B / (A * alpha[i-1] + C);
        beta[i] = (F - A * beta[i-1]) / (A * alpha[i-1] + C);
    }

    C_arr[n] = 0;
    for (let i = n - 1; i >= 1; i--) C_arr[i] = alpha[i] * C_arr[i+1] + beta[i];
    C_arr[0] = 0;

    for (let i = 1; i <= n; i++) {
        a[i] = y[i-1];
        d[i] = (C_arr[i] - C_arr[i-1]) / (3 * h[i]);
        b[i] = (y[i] - y[i-1]) / h[i] - (h[i] / 3) * (2 * C_arr[i-1] + C_arr[i]);
    }

    // --- ФОРМИРОВАНИЕ HTML ОТЧЕТА ПО ТВОЕМУ ШАБЛОНУ ---
    let html = `<h3>Нахождение кубического сплайна:</h3>`;
    
    // Блок ДАНО
    html += `<b>Дано:</b>`;
    let table = `<table><tr><td><b>X</b></td>`;
    for(let val of x) table += `<td>${fmt(val)}</td>`;
    table += `</tr><tr><td><b>Y</b></td>`;
    for(let val of y) table += `<td>${fmt(val)}</td>`;
    table += `</tr></table>`;
    html += table;

    // Общая формула
    html += `<b>Формула кубического сплайна имеет вид:</b><br>`;
    html += `<div class="math-block">$$ S_i = a_i + b_i \\cdot (x - x_{i-1}) + c_i \\cdot (x - x_{i-1})^2 + d_i \\cdot (x - x_{i-1})^3 $$</div>`;
    
    // Шаг 1. Расстояния h
    html += `<b>1. Находим расстояния между точками по оси X:</b><br>`;
    html += `<div class="math-block">$$ h_i = x_i - x_{i-1} $$</div>Получаем:<br><div class="math-block">$$ \\begin{aligned} `;
    for(let i=1; i<=n; i++) html += `h_${i} &= ${fmt(x[i])} - ${wrapNeg(x[i-1])} = ${fmt(h[i])} \\\\ `;
    html += `\\end{aligned} $$</div>`;

    // Шаг 2. Коэффициенты C
    html += `<b>2. Общие формулы</b><br><b>2.1 Коэффициенты С.</b><br>Чтобы найти все a, b, c, d, нам сначала нужно найти вспомогательные коэффициенты C.<br>`;
    html += `По правилам "естественного" сплайна, на краях графика они равны нулю: <b>C₀ = 0, Cₙ = 0</b>.<br><br>`;
    html += `Для внутренних C используется формула:<br>`;
    html += `<div class="math-block">$$ h_i \\cdot C_{i-1} + 2 \\cdot (h_i + h_{i+1}) \\cdot C_i + h_{i+1} \\cdot C_{i+1} = 3 \\cdot \\left( \\frac{y_{i+1} - y_i}{h_{i+1}} - \\frac{y_i - y_{i-1}}{h_i} \\right) $$</div>`;

    if(n > 1) {
        html += `Получаем систему:<br><div class="math-block">$$ \\begin{cases} `;
        for(let i=1; i<n; i++) {
            let left = `${fmt(h[i])} \\cdot C_{${i-1}} + 2 \\cdot (${fmt(h[i])} + ${fmt(h[i+1])}) \\cdot C_{${i}} + ${fmt(h[i+1])} \\cdot C_{${i+1}}`;
            let right = `3 \\cdot \\left( \\frac{${fmt(y[i+1])} - ${wrapNeg(y[i])}}{${fmt(h[i+1])}} - \\frac{${fmt(y[i])} - ${wrapNeg(y[i-1])}}{${fmt(h[i])}} \\right)`;
            html += `${left} = ${right} \\\\ `;
        }
        html += `\\end{cases} $$</div>`;
        
        let cRes = [];
        for(let i=1; i<n; i++) cRes.push(`C_${i} = ${fmt(C_arr[i])}`);
        html += `Получаем: <b>${cRes.join('; ')}</b>.<br><br>`;
    }

    // Следовательно С
    html += `Следовательно (\\( c_i = C_{i-1} \\)):<br><div class="math-block">$$ \\begin{aligned} `;
    for(let i=1; i<=n; i++) html += `c_${i} &= ${fmt(C_arr[i-1])} \\\\ `;
    html += `\\end{aligned} $$</div>`;

    // Шаг 2.2 a
    html += `<b>2.2 Коэффициенты a.</b><div class="math-block">$$ a_i = y_{i-1} $$</div>Таким образом:<br><div class="math-block">$$ \\begin{aligned} `;
    for(let i=1; i<=n; i++) html += `a_${i} &= ${fmt(y[i-1])} \\\\ `;
    html += `\\end{aligned} $$</div>`;

    // Шаг 2.3 b
    html += `<b>2.3 Коэффициенты b.</b><div class="math-block">$$ b_i = \\frac{y_i - y_{i-1}}{h_i} - \\frac{h_i}{3} \\cdot (2 \\cdot C_{i-1} + C_i) $$</div>Таким образом:<br><div class="math-block">$$ \\begin{aligned} `;
    for(let i=1; i<=n; i++) {
        html += `b_${i} &= \\frac{${fmt(y[i])} - ${wrapNeg(y[i-1])}}{${fmt(h[i])}} - \\frac{${fmt(h[i])}}{3} \\cdot (2 \\cdot ${wrapNeg(C_arr[i-1])} + ${wrapNeg(C_arr[i])}) = ${fmt(b[i])} \\\\ `;
    }
    html += `\\end{aligned} $$</div>`;

    // Шаг 2.4 d
    html += `<b>2.4 Коэффициенты d.</b><div class="math-block">$$ d_i = \\frac{C_i - C_{i-1}}{3 \\cdot h_i} $$</div>Таким образом:<br><div class="math-block">$$ \\begin{aligned} `;
    for(let i=1; i<=n; i++) {
        html += `d_${i} &= \\frac{${fmt(C_arr[i])} - ${wrapNeg(C_arr[i-1])}}{3 \\cdot ${fmt(h[i])}} = ${fmt(d[i])} \\\\ `;
    }
    html += `\\end{aligned} $$</div>`;

    // Итоговые уравнения
    html += `<h3>Итоговый сплайн:</h3><div class="math-block">$$ \\begin{aligned} `;
    for(let i=1; i<=n; i++) {
        let a_str = `${fmt(a[i])}`;
        let b_str = b[i] >= 0 ? `+ ${fmt(b[i])}` : `- ${fmt(Math.abs(b[i]))}`;
        let c_str = C_arr[i-1] >= 0 ? `+ ${fmt(C_arr[i-1])}` : `- ${fmt(Math.abs(C_arr[i-1]))}`;
        let d_str = d[i] >= 0 ? `+ ${fmt(d[i])}` : `- ${fmt(Math.abs(d[i]))}`;
        let xTerm = `(x - ${wrapNeg(x[i-1])})`;
        
        html += `S_${i} &= ${a_str} ${b_str} \\cdot ${xTerm} ${c_str} \\cdot ${xTerm}^2 ${d_str} \\cdot ${xTerm}^3 \\\\ `;
    }
    html += `\\end{aligned} $$</div>`;

    // Отрисовка
    let reportDiv = document.getElementById('report');
    reportDiv.innerHTML = html;
    reportDiv.style.display = 'block';
    
    // Заставляем MathJax обработать новые формулы
    MathJax.typesetPromise();
}
</script>

</body>
</html>
